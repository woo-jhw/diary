<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>일기장</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f7f3ea">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="banner" class="hidden"><span>로그인이 만료되었습니다.</span><button id="reloginBtn">다시 로그인</button></div>

<div id="login" class="hidden">
  <h1>일기장</h1>
  <p>일기는 내 Google Drive의 「일기장」 폴더에 저장됩니다.</p>
  <button id="loginBtn" class="primary" disabled>불러오는 중…</button>
  <p id="loginMsg"></p>
</div>

<div id="app" class="hidden">
  <section id="cal">
    <header>
      <h2 id="monthTitle" title="연간 보기"></h2>
      <button id="prevMonth" class="nav">‹</button>
      <button id="nextMonth" class="nav">›</button>
      <button id="todayBtn">오늘</button>
      <button id="searchBtn" title="검색"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
    </header>
    <div id="searchBar" class="hidden">
      <input id="q" type="search" placeholder="일기 검색" autocomplete="off">
      <button id="closeSearch">✕</button>
    </div>
    <div id="results" class="hidden"></div>
    <div class="weekdays"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
    <div id="grid"></div>
    <div id="status"><span id="statusText"></span><button id="logoutBtn">로그아웃</button></div>
  </section>

  <section id="year" class="hidden">
    <header>
      <h2 id="yearTitle"></h2>
      <button id="prevYear" class="nav">‹</button>
      <button id="nextYear" class="nav">›</button>
      <button id="closeYear">달력</button>
    </header>
    <div id="stats"></div>
    <div id="months"></div>
  </section>

  <section id="day">
    <header>
      <button id="backBtn">‹ 달력</button>
      <span class="sp"></span>
      <button id="prevDay" class="nav">‹</button>
      <button id="nextDay" class="nav">›</button>
      <span id="saveState"></span>
    </header>
    <div id="empty">날짜를 선택하세요</div>
    <div class="body hidden" id="dayBody">
      <div id="dayTitle"><small id="dayYm"></small><b id="dayD"></b></div>
      <textarea id="text" placeholder="오늘 있었던 일…"></textarea>
      <div id="photos"></div>

      <input type="file" id="fileInput" accept="image/*" multiple hidden>
    </div>

</div>

<div id="viewer" class="hidden">
  <span id="vCount"></span>
  <button id="vPrev" class="vnav">‹</button>
  <img alt="">
  <button id="vNext" class="vnav">›</button>
  <button id="vClose">✕</button>
</div>

<script>
// ===== 설정 =====
const CLIENT_ID = '561191719904-vdpjgrg86jtfjj17u4ltghin0t4t7lio.apps.googleusercontent.com';
const SCOPE = 'https://www.googleapis.com/auth/drive.file'; // 이 앱이 만든 파일만 접근
const FOLDER_NAME = '일기장';
const PHOTO_FOLDER_NAME = '사진';
const PHOTO_MAX_PX = 1600;
const THUMB_PX = 128;
const API = 'https://www.googleapis.com/drive/v3';
const UPLOAD = 'https://www.googleapis.com/upload/drive/v3';

// ===== 상태 =====
let token = null;        // {access_token, expires_at}
let tokenClient = null;
let started = false;
let folderId = null;
let photoFolderId = null;
let index = {};          // 'YYYY-MM-DD' -> {id, mt}   (mt = Drive 수정 시각. 캐시가 최신인지 판단용)
let entries = {};        // 'YYYY-MM-DD' -> {text, photos:[{id,name}], cover, mt, local}
let pending = {};        // 오프라인 등으로 아직 못 올린 날짜 -> true
let photoCache = {};     // 사진 id -> blob URL
let viewYear, viewMonth; // 달력에 보이는 달 (month는 0부터)
let currentDate = null;  // 열려 있는 날
let viewerIndex = 0;
const dirty = new Set(); // 저장 안 된 날짜들
let saveTimer = null;
const saving = {};       // 날짜별 저장 순서 보장

const $ = id => document.getElementById(id);
const DOW = ['일','월','화','수','목','금','토'];
const pad = n => String(n).padStart(2, '0');
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isNetworkError = e => e instanceof TypeError || !navigator.onLine;
const blank = () => ({ text: '', photos: [], cover: null, mt: null, local: false });

// ===== 로컬 캐시 =====
function loadCache() {
  try { index = JSON.parse(localStorage.getItem('index') || '{}'); } catch { index = {}; }
  try { entries = JSON.parse(localStorage.getItem('entries') || '{}'); } catch { entries = {}; }
  try { pending = JSON.parse(localStorage.getItem('pending') || '{}'); } catch { pending = {}; }
  for (const d in index) if (typeof index[d] !== 'object') { index = {}; break; } // 옛 형식
  for (const d in entries) if (entries[d].local) pending[d] = true; // 저장 중에 껐던 것
}
let cacheTimer = null;
function persistCache() {
  clearTimeout(cacheTimer);
  cacheTimer = setTimeout(() => {
    try { localStorage.setItem('entries', JSON.stringify(entries)); }
    catch {
      // 용량 초과: 올해가 아닌 썸네일부터 버림
      const y = String(new Date().getFullYear());
      for (const d in entries) if (!d.startsWith(y)) entries[d].cover = null;
      try { localStorage.setItem('entries', JSON.stringify(entries)); } catch {}
    }
  }, 300);
}
function persistIndex() { localStorage.setItem('index', JSON.stringify(index)); }
function persistPending() { localStorage.setItem('pending', JSON.stringify(pending)); }
function hasEntry(date) { return !!(index[date] || pending[date]); }
// 캐시된 내용이 Drive와 같은가 (로컬 수정분이 있으면 무조건 캐시 우선)
function entryFresh(date) {
  const e = entries[date];
  if (!e) return false;
  if (e.local || pending[date]) return true;
  if (!index[date]) return false;
  return e.mt === index[date].mt;
}

// ===== 로그인 =====
function onGisLoaded() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPE,
    callback: resp => {
      if (resp.error) { $('loginMsg').textContent = '로그인 실패: ' + resp.error; return; }
      token = { access_token: resp.access_token, expires_at: Date.now() + resp.expires_in * 1000 };
      localStorage.setItem('token', JSON.stringify(token));
      $('banner').classList.add('hidden');
      if (started) { flush(); flushPending(); resync(); }
      else start();
    }
  });
  $('loginBtn').disabled = false;
  $('loginBtn').textContent = 'Google 계정으로 로그인';
}

function loadToken() {
  try {
    const t = JSON.parse(localStorage.getItem('token'));
    if (t && t.expires_at > Date.now() + 60000) token = t;
  } catch {}
}

function showLogin(msg) {
  $('app').classList.add('hidden');
  $('login').classList.remove('hidden');
  if (msg) $('loginMsg').textContent = msg;
}

function tokenExpired() {
  if (token) {
    token = null;
    localStorage.removeItem('token');
  }
  if (started) $('banner').classList.remove('hidden');
  else showLogin('로그인이 만료되었습니다. 다시 로그인해 주세요.');
}

function logout() {
  if (token && window.google) google.accounts.oauth2.revoke(token.access_token);
  token = null;
  localStorage.removeItem('token');
  location.reload();
}

// ===== Drive API =====
async function api(url, opts = {}) {
  if (!token) { tokenExpired(); throw new Error('로그인 만료'); }
  const headers = Object.assign({}, opts.headers, { Authorization: 'Bearer ' + token.access_token });
  const res = await fetch(url, Object.assign({}, opts, { headers }));
  if (res.status === 401) { tokenExpired(); throw new Error('로그인 만료'); }
  if (!res.ok) throw new Error(`Drive 오류 ${res.status}`);
  return res;
}

async function findOrCreateFolder(name, parent) {
  let q = `name='${name}' and mimeType='application/vnd.google-apps.folder' and trashed=false`;
  if (parent) q += ` and '${parent}' in parents`;
  const r = await (await api(`${API}/files?q=${encodeURIComponent(q)}&fields=files(id)`)).json();
  if (r.files.length) return r.files[0].id;
  const meta = { name, mimeType: 'application/vnd.google-apps.folder' };
  if (parent) meta.parents = [parent];
  const c = await (await api(`${API}/files?fields=id`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(meta)
  })).json();
  return c.id;
}

async function loadIndex() {
  const found = {};
  let pageToken = '';
  do {
    const q = `'${folderId}' in parents and name contains '.json' and trashed=false`;
    let url = `${API}/files?q=${encodeURIComponent(q)}&fields=nextPageToken,files(id,name,modifiedTime)&pageSize=1000`;
    if (pageToken) url += '&pageToken=' + pageToken;
    const r = await (await api(url)).json();
    for (const f of r.files) {
      const d = f.name.replace(/\.json$/, '');
      if (/^\d{4}-\d{2}-\d{2}$/.test(d)) found[d] = { id: f.id, mt: f.modifiedTime };
    }
    pageToken = r.nextPageToken || '';
  } while (pageToken);
  index = found;
  persistIndex();
  // 다른 기기에서 지운 날짜는 캐시에서도 제거
  for (const d in entries) if (!index[d] && d !== currentDate && !entries[d].local && !pending[d]) delete entries[d];
  persistCache();
}

async function loadEntry(date) {
  if (entryFresh(date)) return entries[date];
  if (!index[date]) return entries[date] = blank();
  const e = await (await api(`${API}/files/${index[date].id}?alt=media`)).json();
  entries[date] = { text: e.text || '', photos: e.photos || [], cover: e.cover || null, mt: index[date].mt, local: false };
  persistCache();
  // 썸네일 기능 전에 저장된 일기: 사진은 있는데 썸네일이 없으면 만들어서 채움
  if (entries[date].photos.length && !entries[date].cover) {
    const ent = entries[date];
    updateCover(ent).then(() => saveEntry(date)).then(() => { if (viewYear === parse(date).getFullYear() && viewMonth === parse(date).getMonth()) renderGrid(); }).catch(() => {});
  }
  return entries[date];
}

// 보이는 달의 일기를 미리 받아둠 (달력 칸 미리보기용)
async function ensureMonthEntries(y, m) {
  const prefix = `${y}-${pad(m + 1)}`;
  const dates = Object.keys(index).filter(d => d.startsWith(prefix) && !entryFresh(d));
  if (!dates.length) return;
  await Promise.all(dates.map(d => loadEntry(d).catch(() => {})));
  if (viewYear === y && viewMonth === m) renderGrid();
}

// 전체 일기를 받아둠 (검색용)
async function ensureAllEntries(onProgress) {
  const dates = Object.keys(index).filter(d => !entryFresh(d));
  for (let i = 0; i < dates.length; i += 8) {
    await Promise.all(dates.slice(i, i + 8).map(d => loadEntry(d).catch(() => {})));
    onProgress(Math.min(i + 8, dates.length), dates.length);
  }
}

async function uploadMultipart(meta, blob) {
  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify(meta)], { type: 'application/json' }));
  form.append('file', blob);
  const r = await (await api(`${UPLOAD}/files?uploadType=multipart&fields=id,modifiedTime`, { method: 'POST', body: form })).json();
  return r;
}

// 같은 날짜의 저장이 겹치지 않도록 순서대로 실행
function saveEntry(date) {
  saving[date] = (saving[date] || Promise.resolve()).catch(() => {}).then(() => writeEntry(date));
  return saving[date];
}

async function writeEntry(date) {
  const e = entries[date];
  const isEmpty = !e.text.trim() && e.photos.length === 0;
  if (isEmpty) {
    if (index[date]) {
      await api(`${API}/files/${index[date].id}`, { method: 'DELETE' });
      delete index[date];
      persistIndex();
    }
    e.mt = null; // 파일은 없지만 화면에서 계속 쓸 수 있게 객체는 유지
    persistCache();
    return;
  }
  const body = JSON.stringify({ date, text: e.text, photos: e.photos, cover: e.cover });
  let r;
  if (index[date]) {
    r = await (await api(`${UPLOAD}/files/${index[date].id}?uploadType=media&fields=id,modifiedTime`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body
    })).json();
  } else {
    r = await uploadMultipart({ name: date + '.json', parents: [folderId] }, new Blob([body], { type: 'application/json' }));
  }
  index[date] = { id: r.id, mt: r.modifiedTime };
  e.mt = r.modifiedTime;
  persistIndex();
  persistCache();
}

async function photoUrl(id) {
  if (photoCache[id]) return photoCache[id];
  const blob = await (await api(`${API}/files/${id}?alt=media`)).blob();
  return photoCache[id] = URL.createObjectURL(blob);
}

// 긴 변 기준으로 줄여서 JPEG로 변환
function resizeImage(blob, max, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s);
      c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      c.toBlob(b => b ? resolve(b) : reject(new Error('이미지 변환 실패')), 'image/jpeg', quality);
    };
    img.onerror = () => reject(new Error('이미지를 열 수 없습니다'));
    img.src = URL.createObjectURL(blob);
  });
}

// 달력 칸에 보여줄 작은 썸네일 (일기 파일 안에 같이 저장됨)
async function makeThumb(blob) {
  const small = await resizeImage(blob, THUMB_PX, 0.7);
  return new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(small); });
}

async function updateCover(e) {
  if (!e.photos.length) { e.cover = null; return; }
  const url = await photoUrl(e.photos[0].id);
  e.cover = await makeThumb(await (await fetch(url)).blob());
}

// ===== 시작 / 동기화 =====
async function start() {
  started = true;
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  renderGrid();
  await resync();
  flushPending();
}

async function resync() {
  if (!navigator.onLine) { setStatus('오프라인'); return; }
  if (!token) return;
  setStatus('동기화 중…');
  try {
    if (!folderId) {
      folderId = await findOrCreateFolder(FOLDER_NAME);
      photoFolderId = await findOrCreateFolder(PHOTO_FOLDER_NAME, folderId);
    }
    await loadIndex();
    renderGrid();
    setStatus('');
    // 열려 있는 날이 다른 기기에서 바뀌었으면 다시 불러옴
    if (currentDate && !dirty.has(currentDate) && !entryFresh(currentDate)) {
      const d = currentDate;
      const e = await loadEntry(d);
      if (currentDate === d && !dirty.has(d)) { $('text').value = e.text; renderPhotos(); }
    }
    ensureMonthEntries(viewYear, viewMonth);
  } catch (e) {
    setStatus(e.message === '로그인 만료' ? '' : '동기화 실패: ' + e.message);
  }
}

// 오프라인 때 못 올린 것들 재시도
async function flushPending() {
  if (!navigator.onLine || !token) return;
  for (const date of Object.keys(pending)) {
    if (!entries[date]) { delete pending[date]; continue; }
    try {
      await saveEntry(date);
      delete pending[date];
      if (!dirty.has(date)) entries[date].local = false;
      persistPending(); persistCache();
      if (currentDate === date) setSaveState('저장됨');
    } catch {}
  }
  renderGrid();
}

function setStatus(t) { $('statusText').textContent = t; }
function setSaveState(t) { $('saveState').textContent = t; }

// ===== 달력 =====
function firstLine(text) { return text.trim().split('\n')[0].slice(0, 60); }

function renderGrid() {
  const grid = $('grid');
  grid.innerHTML = '';
  const startDow = new Date(viewYear, viewMonth, 1).getDay();
  const days = new Date(viewYear, viewMonth + 1, 0).getDate();
  const today = fmt(new Date());
  for (let i = 0; i < startDow; i++) {
    const c = document.createElement('div');
    c.className = 'cell empty';
    grid.appendChild(c);
  }
  for (let d = 1; d <= days; d++) {
    const date = fmt(new Date(viewYear, viewMonth, d));
    const c = document.createElement('div');
    c.className = 'cell';
    if (date === today) c.classList.add('today');
    if (date === currentDate) c.classList.add('sel');
    let inner = `<span class="n">${d}</span>`;
    if (hasEntry(date)) {
      const e = entries[date];
      if (e && e.cover) inner += `<img class="thumb" src="${e.cover}" alt="">`;
      else if (e && e.text.trim()) inner += `<span class="snip">${esc(firstLine(e.text))}</span>`;
      else inner += '<span class="dot"></span>';
    }
    c.innerHTML = inner;
    c.onclick = () => openDay(date);
    grid.appendChild(c);
  }
  $('monthTitle').textContent = `${viewYear}년 ${viewMonth + 1}월`;
}

function moveMonth(delta) {
  const d = new Date(viewYear, viewMonth + delta, 1);
  viewYear = d.getFullYear();
  viewMonth = d.getMonth();
  renderGrid();
  ensureMonthEntries(viewYear, viewMonth);
}

// ===== 연간 보기 / 통계 =====
let statYear;
function openYear() {
  statYear = viewYear;
  $('cal').classList.add('hidden');
  $('year').classList.remove('hidden');
  renderYear();
}
function closeYear() {
  $('year').classList.add('hidden');
  $('cal').classList.remove('hidden');
}
function calcStats(year) {
  const all = Object.keys(index).concat(Object.keys(pending)).filter((d, i, a) => a.indexOf(d) === i).sort();
  const set = new Set(all);
  const inYear = all.filter(d => d.startsWith(year + '-')).length;
  // 현재 연속: 오늘부터 거꾸로 (오늘 아직 안 썼으면 어제부터)
  let cur = 0;
  const d = new Date();
  if (!set.has(fmt(d))) d.setDate(d.getDate() - 1);
  while (set.has(fmt(d))) { cur++; d.setDate(d.getDate() - 1); }
  // 최장 연속
  let best = 0, run = 0, prev = null;
  for (const s of all) {
    const t = parse(s).getTime();
    run = (prev !== null && t - prev === 86400000) ? run + 1 : 1;
    best = Math.max(best, run);
    prev = t;
  }
  return { inYear, total: all.length, cur, best };
}
function renderYear() {
  $('yearTitle').textContent = `${statYear}년`;
  const s = calcStats(statYear);
  $('stats').innerHTML =
    `<span><b>${s.inYear}</b>일 기록</span><span>연속 <b>${s.cur}</b>일</span>` +
    `<span>최장 연속 <b>${s.best}</b>일</span><span>전체 <b>${s.total}</b>일</span>`;
  const box = $('months');
  box.innerHTML = '';
  const today = fmt(new Date());
  for (let m = 0; m < 12; m++) {
    const days = new Date(statYear, m + 1, 0).getDate();
    const startDow = new Date(statYear, m, 1).getDay();
    let cells = '';
    for (let i = 0; i < startDow; i++) cells += '<span></span>';
    for (let d = 1; d <= days; d++) {
      const date = fmt(new Date(statYear, m, d));
      const cls = (hasEntry(date) ? 'has ' : '') + (date === today ? 'today' : '');
      cells += `<span class="${cls}">${d}</span>`;
    }
    const div = document.createElement('div');
    div.className = 'mini';
    div.innerHTML = `<div class="mt">${m + 1}월</div><div class="mg">${cells}</div>`;
    div.onclick = () => { viewYear = statYear; viewMonth = m; closeYear(); renderGrid(); ensureMonthEntries(viewYear, viewMonth); };
    box.appendChild(div);
  }
}

// ===== 검색 =====
let searchTimer = null;
function openSearch() {
  $('searchBar').classList.remove('hidden');
  $('results').classList.remove('hidden');
  document.querySelector('.weekdays').classList.add('hidden');
  $('grid').classList.add('hidden');
  $('q').focus();
  runSearch();
}
function closeSearch() {
  $('searchBar').classList.add('hidden');
  $('results').classList.add('hidden');
  document.querySelector('.weekdays').classList.remove('hidden');
  $('grid').classList.remove('hidden');
}
async function runSearch() {
  const q = $('q').value.trim().toLowerCase();
  const box = $('results');
  if (!q) { box.innerHTML = '<div class="msg">검색어를 입력하세요</div>'; return; }
  const missing = Object.keys(index).filter(d => !entryFresh(d)).length;
  if (missing) {
    box.innerHTML = `<div class="msg">일기 불러오는 중… (0/${missing})</div>`;
    await ensureAllEntries((n, t) => box.innerHTML = `<div class="msg">일기 불러오는 중… (${n}/${t})</div>`);
    if ($('q').value.trim().toLowerCase() !== q) return;
  }
  const hits = Object.keys(entries).filter(d => hasEntry(d) && entries[d].text.toLowerCase().includes(q)).sort().reverse();
  if (!hits.length) { box.innerHTML = '<div class="msg">검색 결과 없음</div>'; return; }
  box.innerHTML = '';
  for (const date of hits) {
    const text = entries[date].text;
    const i = text.toLowerCase().indexOf(q);
    const from = Math.max(0, i - 30);
    let snip = esc(text.slice(from, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length, i + q.length + 60));
    if (from > 0) snip = '…' + snip;
    const d = parse(date);
    const div = document.createElement('div');
    div.className = 'res';
    div.innerHTML = `<b>${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 (${DOW[d.getDay()]})</b><span>${snip.replace(/\n/g, ' ')}</span>`;
    div.onclick = () => openDay(date);
    box.appendChild(div);
  }
}

// ===== 하루 화면 =====
async function openDay(date) {
  await flush();
  const wasOpen = $('day').classList.contains('open');
  if (!wasOpen) history.pushState({ day: 1 }, '');
  currentDate = date;
  const d = parse(date);
  if (d.getFullYear() !== viewYear || d.getMonth() !== viewMonth) {
    viewYear = d.getFullYear();
    viewMonth = d.getMonth();
    ensureMonthEntries(viewYear, viewMonth);
  }
  renderGrid();
  $('day').classList.add('open');
  $('empty').classList.add('hidden');
  $('dayBody').classList.remove('hidden');
  $('dayYm').textContent = `${d.getFullYear()} · ${d.getMonth() + 1}월`;
  $('dayD').textContent = `${d.getDate()}일 ${DOW[d.getDay()]}요일`;
  const ta = $('text');
  ta.value = '';
  ta.disabled = true;
  $('photos').innerHTML = '';
  setSaveState('불러오는 중…');
  try {
    const e = await loadEntry(date);
    if (currentDate !== date) return; // 그 사이 다른 날로 이동함
    ta.value = e.text;
    ta.disabled = false;
    renderPhotos();
    setSaveState(pending[date] ? '오프라인 · 연결되면 저장' : '');
  } catch (err) {
    if (currentDate !== date) return;
    if (entries[date]) { // 오프라인이면 캐시된 내용이라도 보여줌
      ta.value = entries[date].text;
      ta.disabled = false;
      renderPhotos();
      setSaveState('오프라인 (저장된 내용)');
    } else {
      setSaveState('불러오기 실패: ' + err.message);
    }
  }
}

function closeDayUI() {
  flush();
  currentDate = null;
  $('day').classList.remove('open');
  $('empty').classList.remove('hidden');
  $('dayBody').classList.add('hidden');
  renderGrid();
}

function moveDay(delta) {
  const d = parse(currentDate);
  d.setDate(d.getDate() + delta);
  openDay(fmt(d));
}

function markDirty() {
  dirty.add(currentDate);
  entries[currentDate].local = true;
  persistCache();
  setSaveState('…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 1500);
}

async function flush() {
  clearTimeout(saveTimer);
  const dates = [...dirty];
  if (!dates.length) return;
  dirty.clear();
  if (dates.includes(currentDate)) setSaveState('저장 중…');
  for (const date of dates) {
    try {
      await saveEntry(date);
      delete pending[date];
      if (entries[date] && !dirty.has(date)) entries[date].local = false;
      persistPending(); persistCache();
      if (currentDate === date) setSaveState('저장됨');
    } catch (e) {
      if (e.message === '로그인 만료') {
        dirty.add(date);
        if (currentDate === date) setSaveState('로그인 필요');
      } else if (isNetworkError(e)) {
        pending[date] = true;
        persistPending();
        if (currentDate === date) setSaveState('오프라인 · 연결되면 저장');
      } else {
        dirty.add(date);
        if (currentDate === date) setSaveState('저장 실패: ' + e.message);
      }
    }
  }
  renderGrid();
}

function renderPhotos() {
  const box = $('photos');
  box.innerHTML = '';
  const photos = entries[currentDate].photos;
  photos.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'ph';
    const img = document.createElement('img');
    img.alt = p.name;
    photoUrl(p.id).then(u => img.src = u).catch(() => {});
    img.onclick = () => openViewer(i);
    div.appendChild(img);
    const x = document.createElement('button');
    x.className = 'x'; x.textContent = '✕';
    x.onclick = () => deletePhoto(p);
    div.appendChild(x);
    if (i > 0) {
      const l = document.createElement('button');
      l.className = 'l'; l.textContent = '‹'; l.title = '앞으로';
      l.onclick = () => movePhoto(i, -1);
      div.appendChild(l);
    }
    if (i < photos.length - 1) {
      const r = document.createElement('button');
      r.className = 'r'; r.textContent = '›'; r.title = '뒤로';
      r.onclick = () => movePhoto(i, 1);
      div.appendChild(r);
    }
    box.appendChild(div);
  });
}

async function addPhotos(files) {
  const date = currentDate;
  const e = entries[date];
  const list = Array.from(files);
  for (let i = 0; i < list.length; i++) {
    setSaveState(`사진 올리는 중 (${i + 1}/${list.length})…`);
    try {
      const blob = await resizeImage(list[i], PHOTO_MAX_PX, 0.85);
      const name = `${date}_${Date.now()}.jpg`;
      const r = await uploadMultipart({ name, parents: [photoFolderId] }, blob);
      photoCache[r.id] = URL.createObjectURL(blob);
      e.photos.push({ id: r.id, name });
      if (e.photos.length === 1) e.cover = await makeThumb(blob);
      if (currentDate === date) renderPhotos();
    } catch (err) {
      alert('사진 업로드 실패: ' + err.message);
    }
  }
  dirty.add(date);
  e.local = true;
  await flush();
}

async function deletePhoto(p) {
  if (!confirm('이 사진을 삭제할까요?')) return;
  const date = currentDate;
  const e = entries[date];
  const wasFirst = e.photos[0] && e.photos[0].id === p.id;
  e.photos = e.photos.filter(x => x.id !== p.id);
  renderPhotos();
  if (wasFirst) await updateCover(e).catch(() => {});
  dirty.add(date);
  e.local = true;
  await flush();
  try { await api(`${API}/files/${p.id}`, { method: 'DELETE' }); } catch {}
}

async function movePhoto(i, dir) {
  const date = currentDate;
  const e = entries[date];
  const j = i + dir;
  [e.photos[i], e.photos[j]] = [e.photos[j], e.photos[i]];
  renderPhotos();
  if (i === 0 || j === 0) await updateCover(e).catch(() => {});
  dirty.add(date);
  e.local = true;
  flush();
}

// ===== 사진 크게 보기 =====
function openViewer(i) {
  viewerIndex = i;
  showViewerImg();
  $('viewer').classList.remove('hidden');
  history.pushState({ viewer: 1 }, '');
}
function showViewerImg() {
  const photos = entries[currentDate].photos;
  const img = $('viewer').querySelector('img');
  img.src = '';
  photoUrl(photos[viewerIndex].id).then(u => img.src = u).catch(() => {});
  $('vCount').textContent = `${viewerIndex + 1} / ${photos.length}`;
  $('vPrev').style.visibility = viewerIndex > 0 ? '' : 'hidden';
  $('vNext').style.visibility = viewerIndex < photos.length - 1 ? '' : 'hidden';
}
function viewerMove(dir) {
  const n = entries[currentDate].photos.length;
  const j = viewerIndex + dir;
  if (j < 0 || j >= n) return;
  viewerIndex = j;
  showViewerImg();
}
function closeViewerUI() { $('viewer').classList.add('hidden'); }

// 뒤로가기: 사진 보기 → 하루 화면 → 달력 순으로 닫힘
window.addEventListener('popstate', () => {
  if (!$('viewer').classList.contains('hidden')) closeViewerUI();
  else if ($('day').classList.contains('open')) closeDayUI();
});

// ===== 이벤트 연결 =====
$('loginBtn').onclick = () => tokenClient.requestAccessToken();
$('reloginBtn').onclick = () => {
  if (!tokenClient) { alert('인터넷 연결을 확인해 주세요.'); return; }
  tokenClient.requestAccessToken({ prompt: '' });
};
$('logoutBtn').onclick = logout;
$('prevMonth').onclick = () => moveMonth(-1);
$('nextMonth').onclick = () => moveMonth(1);
$('todayBtn').onclick = () => openDay(fmt(new Date()));
$('monthTitle').onclick = openYear;
$('prevYear').onclick = () => { statYear--; renderYear(); };
$('nextYear').onclick = () => { statYear++; renderYear(); };
$('closeYear').onclick = closeYear;
$('searchBtn').onclick = openSearch;
$('closeSearch').onclick = closeSearch;
$('q').oninput = () => { clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 300); };
$('backBtn').onclick = () => history.back();
$('prevDay').onclick = () => moveDay(-1);
$('nextDay').onclick = () => moveDay(1);
$('text').oninput = () => { entries[currentDate].text = $('text').value; markDirty(); };
$('text').onblur = flush;
$('addPhoto').onclick = () => $('fileInput').click();
$('fileInput').onchange = () => { addPhotos($('fileInput').files); $('fileInput').value = ''; };
$('vPrev').onclick = e => { e.stopPropagation(); viewerMove(-1); };
$('vNext').onclick = e => { e.stopPropagation(); viewerMove(1); };
$('vClose').onclick = () => history.back();
$('viewer').onclick = e => { if (e.target === $('viewer')) history.back(); };
let touchX = null;
$('viewer').addEventListener('touchstart', e => touchX = e.touches[0].clientX, { passive: true });
$('viewer').addEventListener('touchend', e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  touchX = null;
  if (Math.abs(dx) > 50) viewerMove(dx < 0 ? 1 : -1);
});
document.addEventListener('keydown', e => {
  if ($('viewer').classList.contains('hidden')) return;
  if (e.key === 'ArrowLeft') viewerMove(-1);
  else if (e.key === 'ArrowRight') viewerMove(1);
  else if (e.key === 'Escape') history.back();
});
window.addEventListener('beforeunload', flush);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { flush(); return; }
  if (!started) return;
  if (token && token.expires_at < Date.now()) tokenExpired();
  else resync();
});
window.addEventListener('online', () => { if (started) { flushPending().then(resync); } });
window.addEventListener('offline', () => setStatus('오프라인'));
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

// ===== 시작 =====
{
  const now = new Date();
  viewYear = now.getFullYear();
  viewMonth = now.getMonth();
  loadCache();
  loadToken();
  if (token) start(); else showLogin();
}
</script>
